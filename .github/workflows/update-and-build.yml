name: Update flake and Build Cache

on:
  schedule:
    - cron: '30 14 * * 1'
  workflow_dispatch:

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check 3 week interval
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          if [ $((10#$(date +%W) % 3)) -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  update-and-build:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Fix AppArmor
        run: |
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl kernel.unprivileged_userns_clone=1

      - name: Maximize build space
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'cleave'

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            system-features = gccarch-x86-64-v3 big-parallel

      - name: Setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: firefly-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update flake.lock
        run: nix flake update

      - name: Commit and push if changed
        run: |
          git add flake.lock
          if ! git diff --staged --quiet; then
            git commit -m "chore: update flake.lock [automated]"
            git push
          fi

      - name: Build nix packages
        run: |
          timeout 5h nix run nixpkgs#nix-fast-build -- \
            --no-nom \
            -f .#packages.x86_64-linux
